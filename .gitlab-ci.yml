---
variables:
  SERVICE_NAME: "product"
  SERVICE_SUFFIX: "_product"
  CI_REGISTRY_IMAGE: "registry.gitlab.com/cheepython/calorie_product"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_HOST_KEY_CHECKING: "false"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 20

stages:
  - build
  - test
  - deploy
  - migrate
  - rollback

# ============================================================================
# BUILD STAGE
# ============================================================================

build:
  stage: build
  tags: [calories_master]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        ENV_TAG="tr"
      elif [ "$CI_COMMIT_REF_NAME" = "prod" ] || [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        ENV_TAG="pr"
      else
        ENV_TAG="$CI_COMMIT_REF_NAME"
      fi

      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile.back" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:${ENV_TAG}" \
        --cache=true \
        --cache-ttl=168h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_REF_NAME == "develop"'
    - if: '$CI_COMMIT_REF_NAME == "prod"'

# ============================================================================
# TEST STAGE
# ============================================================================

test:
  stage: test
  tags: [calories_master]
  image: docker:24.0.5
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - |
      if [ -n "${ENV_TEST}" ] && [ -f "${ENV_TEST}" ]; then
        cp "${ENV_TEST}" .env
      fi
    - export $(grep -v '^#' .env | xargs 2>/dev/null) || true
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker image prune -a -f || true
    - sed -i "s#${CI_REGISTRY_IMAGE}:tr#${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}#g" docker-compose.yml
    - docker compose -f docker-compose.yml up -d
    - docker exec -t backend_${SERVICE_NAME} alembic upgrade head
    - docker exec -t backend_${SERVICE_NAME} pytest -q
  after_script:
    - docker compose -f docker-compose.yml down -v || true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop"'

# ============================================================================
# DEPLOY TO TEST
# ============================================================================

deploy:test:
  stage: deploy
  tags: [ansible]
  image: alpine:3.18
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 3322 $TEST_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - cd ansible
    - |
      ansible-playbook deploy.yml \
        -i inventories/test \
        -e "registry_password=${DEPLOY_TOKEN_PASSWORD}" \
        -e "ansible_ssh_private_key_file=~/.ssh/id_ed25519"
  environment:
    name: test
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop"'
  when: manual

# ============================================================================
# DEPLOY TO PRODUCTION
# ============================================================================

deploy:production:
  stage: deploy
  tags: [ansible]
  image: alpine:3.18
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 3322 $PROD_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - cd ansible
    - |
      ansible-playbook deploy.yml \
        -i inventories/production \
        -e "registry_password=${DEPLOY_TOKEN_PASSWORD}" \
        -e "ansible_ssh_private_key_file=~/.ssh/id_ed25519"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_REF_NAME == "main"'
  when: manual

# ============================================================================
# MIGRATIONS
# ============================================================================

migrate:test:
  stage: migrate
  tags: [ansible]
  image: alpine:3.18
  needs: [deploy:test]
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 3322 $TEST_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - cd ansible
    - ansible-playbook migrate.yml -i inventories/test -e "ansible_ssh_private_key_file=~/.ssh/id_ed25519"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "develop"'
  when: manual

migrate:production:
  stage: migrate
  tags: [ansible]
  image: alpine:3.18
  needs: [deploy:production]
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 3322 $PROD_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - cd ansible
    - ansible-playbook migrate.yml -i inventories/production -e "ansible_ssh_private_key_file=~/.ssh/id_ed25519"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_REF_NAME == "main"'
  when: manual

# ============================================================================
# ROLLBACK
# ============================================================================

rollback:production:
  stage: rollback
  tags: [ansible]
  image: alpine:3.18
  before_script:
    - apk add --no-cache ansible openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p 3322 $PROD_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - cd ansible
    - |
      ansible-playbook rollback.yml \
        -i inventories/production \
        -e "confirm_rollback=yes" \
        -e "registry_password_required=no" \
        -e "ansible_ssh_private_key_file=~/.ssh/id_ed25519"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "prod" || $CI_COMMIT_REF_NAME == "main"'
  when: manual
