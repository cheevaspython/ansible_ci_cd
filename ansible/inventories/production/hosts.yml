[swarm_managers]
# Замените на IP ваших Swarm manager нод для production
# Используйте node.labels.TAG для placement constraints
# Пример: prod-swarm-01 ansible_host=YOUR_SERVER_IP ansible_user=admin_remote ansible_port=3322 swarm_node_label=main

[swarm_workers]
# Worker ноды если есть
# Пример: prod-worker-01 ansible_host=192.168.1.201 ansible_user=admin_remote ansible_port=3322 swarm_node_label=worker

[production:children]
swarm_managers
swarm_workers
